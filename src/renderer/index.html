<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>WhalesLauncher —— dsh 实例与版本管理</title>
    <!--
      内容安全策略（S10）。
      - 本页在 Electron 内以 file:// 加载 IIFE 产物，因此脚本/样式源同时列出
        'self' 与 file:（file:// 源在部分 Chromium 版本下不匹配 'self'，补 file: 更稳）。
      - 无任何远程资源：default-src 'none' + connect-src 'none' 直接封死外链与网络请求
        （后端通信走 contextBridge，不经网络栈）。
      - style-src 保留 'unsafe-inline'：界面由 JS 通过 style 属性写入内联样式与 CSS 变量，
        去掉会导致视觉丢失。
      - object-src / base-uri / form-action 全部禁用，缩小攻击面。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!--
      全部资源均为本地文件：无 CDN、无 Google Fonts、无外部图片。
      界面产物为 IIFE（index.js），与 Electron file:// 加载方式兼容。
    -->
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views.css" />
  </head>
  <body>
    <!-- 启动骨架：index.js 就绪后移除 -->
    <div id="boot" class="boot">
      <div class="boot__mark" aria-hidden="true"></div>
      <div class="boot__title">WhalesLauncher</div>
      <div class="boot__sub">正在准备界面…</div>
    </div>

    <div id="app" class="shell" hidden>
      <!-- 自绘标题栏：品牌 + 应用菜单 + 拖拽区 + 操作区；右侧 WCO 由 Windows 系统绘制 -->
      <header id="titlebar" class="titlebar"></header>
      <div class="shell__body">
        <aside id="rail" class="rail" aria-label="实例列表"></aside>
        <main id="main" class="main" tabindex="-1"></main>
        <aside id="drawer" class="drawer" aria-label="运行日志"></aside>
      </div>
    </div>

    <div id="overlays" class="overlay-host"></div>
    <div id="toasts" class="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>

    <script src="index.js"></script>
  </body>
</html>
